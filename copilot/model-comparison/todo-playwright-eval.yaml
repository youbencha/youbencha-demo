name: agentic-judge:playwright-lists-tasks
description: "Checks that README.md has grammatically correct content"
config:
  type: copilot-cli
  agent_name: agentic-judge
  model: claude-sonnet-4.5
  prompt: "For each assertion, use the Playwright MCP tool to open a new instance of the page and try to perform actions to assert. If the Playwright MCP tool is not available. return 0 for each assertion."
  timeout: 300000  # 5 minutes      
  assertions:
    add_new_list: "Find the navigation for a new list and add a new list. Score 1 if successful, 0 if not successful."
    add_todo_item: "Add a new to-do item to the list. Score 1 if successful, 0 if not successful."
