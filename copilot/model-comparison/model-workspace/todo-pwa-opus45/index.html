<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful progressive web app for managing multiple to-do lists">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Todo PWA">
    <title>Todo Lists PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="images/icons/icon.svg">
    <link rel="apple-touch-icon" href="images/icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" aria-label="Lists navigation">
            <div class="sidebar-header">
                <h2>My Lists</h2>
                <button class="btn-icon" id="closeSidebar" aria-label="Close sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="sidebar-content">
                <ul class="lists-nav" id="listsNav" role="listbox" aria-label="To-do lists">
                    <!-- Lists will be rendered here -->
                </ul>
                <button class="btn-new-list" id="newListBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span>New List</span>
                </button>
            </div>
        </aside>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Toolbar -->
            <header class="toolbar">
                <button class="btn-icon" id="menuBtn" aria-label="Open menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18"/>
                    </svg>
                </button>
                <h1 class="toolbar-title" id="currentListTitle">Select a List</h1>
                <div class="toolbar-actions">
                    <button class="btn-icon" id="editListBtn" aria-label="Edit list" title="Edit list name" hidden>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button class="btn-icon btn-danger" id="deleteListBtn" aria-label="Delete list" title="Delete list" hidden>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Tasks Container -->
            <div class="tasks-container" id="tasksContainer">
                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                        <rect x="9" y="3" width="6" height="4" rx="1"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                    <h3 id="emptyStateTitle">Welcome to Todo Lists</h3>
                    <p id="emptyStateMessage">Create a new list to get started!</p>
                </div>

                <!-- Tasks List -->
                <ul class="tasks-list" id="tasksList" role="list" aria-label="Tasks">
                    <!-- Tasks will be rendered here -->
                </ul>
            </div>

            <!-- Floating Action Button -->
            <button class="fab" id="addTaskBtn" aria-label="Add new task" title="Add new task" hidden>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </button>
        </main>
    </div>

    <!-- New List Dialog -->
    <dialog class="dialog" id="newListDialog">
        <form method="dialog" class="dialog-content">
            <h2 id="listDialogTitle">Create New List</h2>
            <div class="form-group">
                <label for="listNameInput">List name</label>
                <input type="text" id="listNameInput" maxlength="50" placeholder="Enter list name" required>
            </div>
            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" id="cancelListDialog">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveListBtn">Create</button>
            </div>
        </form>
    </dialog>

    <!-- Delete Confirmation Dialog -->
    <dialog class="dialog" id="deleteDialog">
        <div class="dialog-content">
            <h2>Delete <span id="deleteItemType">List</span>?</h2>
            <p id="deleteMessage">Are you sure you want to delete this list and all its tasks?</p>
            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" id="cancelDeleteDialog">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </dialog>

    <!-- Toast Notification -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <!-- Offline Indicator -->
    <div class="offline-indicator" id="offlineIndicator" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
        </svg>
        <span>You're offline</span>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
