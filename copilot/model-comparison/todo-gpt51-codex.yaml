name: "Test model comparison for building to do app using GPT-5.1-codex"
description: "Test model comparison for building to do app using GPT-5.1-codex"
workspace_name: todo-pwa-gpt51-codex
# Repository configuration
repo: https://github.com/youbencha/hello-world.git
branch: demo

# Agent configuration
agent:
  type: copilot-cli
  agent_name: pwa-expert-agent
  model: gpt-5.1-codex
  config:
    prompt_file: ./build-todo-prompt.md

# Evaluators
evaluators:
  # Standard git-diff to track scope of changes
  - name: git-diff
    config:
      assertions:
        max_files_changed: 10
        max_total_changes: 25000
  - file: ./todo-playwright-eval.yaml
  